apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  # Deliberately NO cascade finalizer: deleting the root by mistake must not
  # cascade-delete every child Application and their workloads.
spec:
  project: default                         # Bootstrap app is admin-owned
  source:
    repoURL: https://github.com/Rajendra0609/argocd-labs.git
    targetRevision: main
    path: argocd
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
