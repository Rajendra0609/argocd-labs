apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
patches:
  - target:
      kind: Service
      name: podinfo
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: podinfo
      spec:
        type: NodePort
  - target:
      kind: Deployment
      name: podinfo
    patch: |-
      - op: add
        path: /spec/replicas
        value: 2
